name: Flame CI

on:
  push:
    branches: [main, rust-migration]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust
        run: cargo check
      - name: Build Rust
        run: cargo build --release
