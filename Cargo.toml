[package]
name = "voidflame-system"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "High-performance Discord bot and dashboard for VoidFlame System"

[dependencies]
anyhow = "1"
axum = "0.8.9"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "migrate",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tower-http = { version = "0.6", features = ["compression-full", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
