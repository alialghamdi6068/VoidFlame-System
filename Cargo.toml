[package]
name = "voidflame-system"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "form"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["builder","cache","client","gateway","http","model","rustls_backend"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls","sqlite"] }
tokio = { version = "1", features = ["macros","rt-multi-thread","signal","sync","time"] }
tower-http = { version = "0.6", features = ["compression-full","trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
